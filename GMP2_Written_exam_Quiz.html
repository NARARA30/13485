<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMP 2급 필기 퀴즈</title>
<style>
/* ============================================================
   GMP 2급 필기 퀴즈 — ISO 13485 퀴즈와 동일 레이아웃/스타일
   ============================================================ */
:root{
  --blue:#1f5a99; --blue2:#2f6fb3; --pri:#2f6fb3;
  --bg:#f5f7fa; --card:#fff; --line:#e6eaf0;
  --ok:#3e9d7c; --ng:#e4572e; --muted:#64748b; --warn:#c8690f;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:#1e293b;line-height:1.6;}
hr{border:none;border-top:1px solid var(--line);margin:16px 0;}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
header h1{font-size:18px;margin:0;font-weight:700;}
header .sub{font-size:12px;opacity:.85;}
.tabs{margin-left:auto;display:flex;gap:6px;}
.tabs button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.tabs button.active{background:#fff;color:var(--blue);}
.wrap{max-width:880px;margin:18px auto;padding:0 14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.hidden{display:none!important;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
label{font-size:13px;font-weight:600;color:#334155;}
select,input,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;}
textarea{width:100%;min-height:70px;resize:vertical;}
input[type=text]{width:100%;}
.field{margin-bottom:12px;}
.field>label{display:block;margin-bottom:5px;}
.note{font-size:12.5px;color:var(--muted);}
.btn{background:var(--blue2);color:#fff;border:none;padding:10px 18px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;}
.btn:hover{filter:brightness(1.05);}
.btn.sec{background:#eef2f9;color:var(--blue);border:1px solid var(--line);}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip{display:inline-block;background:#e8f1fb;color:var(--blue);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:700;margin-right:6px;}
.chip.cat{background:#f1f4f8;color:var(--warn);}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;background:#eef2f9;color:#334155;}
.progress{height:8px;background:#e8f1fb;border-radius:6px;overflow:hidden;margin:10px 0 4px;}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));width:0;transition:width .25s;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%;text-align:center;}
.toast.show{opacity:.96;}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
.score{font-weight:700;color:var(--blue);}
.qtext{font-size:17px;font-weight:600;margin:14px 0;white-space:pre-wrap;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15px;transition:.12s;}
.opt:hover{border-color:var(--blue2);background:#f5f7fa;}
.opt.sel{border-color:var(--blue2);background:#e8f1fb;}
.opt.correct{border-color:var(--ok);background:#e6f4ee;}
.opt.wrong{border-color:var(--ng);background:#fbeae3;}
.opt .mk{font-weight:800;margin-right:8px;}
.answin{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0 2px;}
.answin:focus{border-color:var(--blue2);outline:none;}
.answin.ta{min-height:96px;resize:vertical;line-height:1.5;}
.ansbox{margin-top:14px;border-left:5px solid var(--blue2);background:#f5f7fa;border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:14.5px;}
.ansbox .lbl{font-weight:800;color:var(--blue);}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
.summary{text-align:center;padding:30px 10px;}
.summary .big{font-size:40px;font-weight:800;color:var(--blue);}
.list{margin-top:14px;}
.qitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.qitem .body{flex:1;min-width:0;}
.qitem .qq{font-size:14px;font-weight:600;}
.qitem .small{font-size:12px;color:var(--muted);margin-top:3px;}
.qitem .acts{display:flex;gap:6px;flex-shrink:0;}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px;}
.iconbtn.del{color:var(--ng);}
.study-boxes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.study-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .15s,border-color .15s;cursor:pointer;text-align:center;height:100%;}
.study-box:hover{border-color:var(--blue2);box-shadow:0 3px 10px rgba(46,117,182,.12);}
.study-ico{width:36px;height:36px;border-radius:10px;background:#e8f1fb;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rpt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;}
.rpt-box{background:#fff;border-radius:14px;padding:24px 22px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.22);max-height:90vh;overflow-y:auto;}
.rpt-box h3{margin:0 0 12px;font-size:17px;}
.rpt-qtxt{font-size:13px;color:#475569;background:#f5f7fa;border-radius:8px;padding:10px 13px;margin-bottom:14px;white-space:pre-wrap;}
@media(max-width:560px){.qtext{font-size:16px;}header h1{font-size:16px;}}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}</style>
</head>
<body>
<script>try{localStorage.setItem('last_quiz_url','GMP2_Written_exam_Quiz.html')}catch(e){}</script>

<header>
  <div>
    <h1>GMP 2급 필기 퀴즈</h1>
    <div class="sub">FrontOffice 풀이 · BackOffice 문제 관리 (데이터는 이 브라우저에 저장)</div>
  </div>
  <div class="tabs">
    <button onclick="location.href='/'">← 나라라30 공부방 목록이동</button>
    <button id="tabBack" onclick="showTab('back')">⚙ 문제 관리</button>
  </div>
</header>

<div class="wrap">
  <div id="front">

    <!-- 설정 -->
    <div id="setup" class="card">
      <h2 style="margin:0 0 12px;font-size:18px;">퀴즈 설정</h2>
      <div class="row" style="margin-bottom:12px;align-items:center;gap:10px;">
        <label>레벨</label>
        <div id="levelTabs" style="display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;">
          <button type="button" data-level="1" onclick="setLevel('1')" style="padding:8px 16px;border:none;border-right:1.5px solid var(--line);background:var(--blue2);color:#fff;font-weight:700;font-size:13px;cursor:pointer;">LEVEL 1</button>
          <button type="button" data-level="2" onclick="setLevel('2')" style="padding:8px 16px;border:none;border-right:1.5px solid var(--line);background:#fff;color:#475569;font-weight:700;font-size:13px;cursor:pointer;">LEVEL 2</button>
          <button type="button" data-level="3" onclick="setLevel('3')" style="padding:8px 16px;border:none;background:#fff;color:#475569;font-weight:700;font-size:13px;cursor:pointer;">LEVEL 3</button>
        </div>
        <span class="note" id="levelDesc">기본 문제 세트</span>
      </div>
      <div class="row" style="margin-bottom:12px;">
        <label>유형</label>
        <select id="fType" onchange="refreshSetup()">
          <option value="all">전체</option>
          <option value="mc">객관식</option>
          <option value="short">단답형</option>
          <option value="essay">서술형·논술형</option>
          <option value="scenario">시나리오</option>
        </select>
        <label>과목(장)</label>
        <select id="fCat" onchange="refreshSetup()">
          <option value="all">전체</option>
          <option>의약품 GMP</option>
          <option>GMP 실사기준</option>
          <option>분야별 GMP</option>
          <option>GMP 운영관리</option>
          <option>밸리데이션</option>
          <option>적격성평가</option>
        </select>
        <label>순서</label>
        <select id="fOrder">
          <option value="seq">순서대로</option>
          <option value="rand">무작위</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:14px;">
        <label><input type="checkbox" id="fOnlyMC" onchange="refreshSetup()"> 객관식만 자동채점 모드</label>
        <span class="note" id="fCount"></span>
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn" id="btnStart" onclick="startQuiz()">퀴즈 시작 ▶</button>
        <button class="btn ghost" id="btnRestart" style="display:none;" onclick="restartQuiz()">↺ 퀴즈 재시작</button>
        <button class="btn" id="btnWrong" style="display:none;background:#f47b20;" onclick="startWrongNote()">📝 오답 노트 (<span id="wrongCount">0</span>문)</button>
        <span id="progressInfo" class="note" style="font-size:12.5px;"></span>
      </div>
    </div>

    <!-- 이론학습 박스 6개 -->
    <div class="study-boxes" id="studyBoxes"></div>

    <!-- 풀이 -->
    <div id="quiz" class="card hidden">
      <div class="meta">
        <span><span class="chip cat" id="qCat"></span><span class="chip" id="qClause"></span></span>
        <span id="qPosTotal" class="note"></span>
      </div>
      <div class="progress"><div id="qBar"></div></div>
      <div class="meta">
        <span class="score" id="qScore"></span>
        <span class="note" id="qType"></span>
        <span id="wrongModeBadge" style="display:none;background:#f47b20;color:#fff;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:6px;">📝 오답 노트</span>
      </div>
      <div class="qtext" id="qText"></div>
      <div id="qOpts"></div>
      <textarea id="qTextAns" class="answin ta hidden" placeholder="답안을 작성한 뒤 '정답·해설 보기'를 누르세요"></textarea>
      <div id="qAns" class="ansbox hidden"></div>
      <div class="nav">
        <button class="btn ghost" onclick="prevQ()" id="btnPrev">◀ 이전</button>
        <button class="btn sec" onclick="reveal()" id="btnReveal">정답·해설 보기</button>
        <button class="btn" onclick="nextQ()" id="btnNext">다음 ▶</button>
      </div>
      <hr>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <button class="btn ghost" onclick="endQuiz()">■ 종료하고 설정으로</button>
        <button class="btn" style="background:#e4572e;font-size:13px;padding:8px 14px;" onclick="openReport()">🚨 신고하기</button>
      </div>
    </div>

    <!-- 결과 -->
    <div id="result" class="card hidden">
      <div class="summary">
        <div class="badge">결과</div>
        <div class="big" id="rScore"></div>
        <p id="rText" class="note"></p>
        <div class="row" style="justify-content:center;gap:8px;">
          <button class="btn" onclick="endQuiz()">설정으로</button>
          <button class="btn sec" onclick="location.href='/'">공부방 목록으로</button>
        </div>
      </div>
    </div>

  </div>

  <!-- BACK OFFICE -->
  <div id="back" class="hidden">
    <div class="card">
      <h2 style="margin:0 0 6px;font-size:18px;">문제 추가 / 수정</h2>
      <p class="note">문제는 이 브라우저에 자동 저장됩니다. 다른 PC로 옮기려면 <b>내보내기</b>로 JSON을 백업하세요.</p>
      <input type="hidden" id="eId">
      <div class="field">
        <label>유형</label>
        <select id="eType" onchange="toggleType()">
          <option value="mc">객관식 (4지선다, 자동채점)</option>
          <option value="short">단답형 (정답 텍스트 확인)</option>
          <option value="essay">서술형·논술형 (모범답안 확인)</option>
          <option value="scenario">시나리오 (판단형)</option>
        </select>
      </div>
      <div class="row" style="gap:14px;">
        <div class="field" style="flex:1;min-width:150px;">
          <label>레벨</label>
          <select id="eLevel"><option value="1">LEVEL 1</option><option value="2">LEVEL 2</option><option value="3">LEVEL 3</option></select>
        </div>
        <div class="field" style="flex:1;min-width:150px;">
          <label>과목(분류)</label>
          <select id="eCat">
            <option>의약품 GMP</option><option>GMP 실사기준</option><option>분야별 GMP</option>
            <option>GMP 운영관리</option><option>밸리데이션</option><option>적격성평가</option><option>기타</option>
          </select>
        </div>
        <div class="field" style="flex:1;min-width:150px;">
          <label>근거/조항 (선택)</label>
          <input type="text" id="eClause" placeholder="예: 별표2 7.5">
        </div>
      </div>
      <div class="field"><label>문제</label><textarea id="eQ" placeholder="문제 본문"></textarea></div>
      <div id="mcFields">
        <div class="field"><label>보기 (한 줄에 하나씩, 2~5개)</label><textarea id="eOpts" placeholder="보기1&#10;보기2&#10;보기3&#10;보기4"></textarea></div>
        <div class="field"><label>정답 번호 (1부터)</label><input type="text" id="eAnsIdx" placeholder="3" style="width:80px;"></div>
        <div class="field"><label>해설</label><textarea id="eExpl" placeholder="정답 근거·해설"></textarea></div>
      </div>
      <div id="txtFields">
        <div class="field"><label>정답 / 모범답안</label><textarea id="eAns" placeholder="정답 또는 모범답안"></textarea></div>
        <div class="field"><label>해설 (선택)</label><textarea id="eExpl2" placeholder="추가 해설"></textarea></div>
      </div>
      <div class="row">
        <button class="btn" onclick="saveQ()">저장</button>
        <button class="btn ghost" onclick="resetForm()">새로 작성</button>
        <span class="note" id="saveMsg"></span>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
        <h2 style="margin:0;font-size:18px;">문제 목록 (<span id="bCount">0</span>)</h2>
        <div class="row" style="flex-wrap:wrap;gap:6px;">
          <button class="btn sec" onclick="exportJSON()">⬇ 내보내기(JSON)</button>
          <label class="btn sec" style="cursor:pointer;">⬆ 가져오기<input type="file" id="impFile" accept=".json" style="display:none;" onchange="importJSON(event)"></label>
          <button class="btn ghost" onclick="resetSeed()">기본 문제로 초기화</button>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <input type="text" id="bSearch" placeholder="검색(문제/과목/근거)" oninput="renderList()" style="flex:1;">
      </div>
      <div class="list" id="bList"></div>
    </div>
  </div>

</div><!-- /.wrap -->

<!-- 오늘의 학습 -->
<div class="wrap" style="padding-top:0;">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <h2 style="margin:0 0 4px;font-size:18px;">📊 오늘의 학습</h2>
        <p class="note" id="dailyToday" style="margin:0;">오늘 푼 문제 0개</p>
      </div>
      <div onclick="setExamDate()" title="클릭하여 시험일 설정" style="text-align:center;background:#fff4ea;border:1.5px solid #ffd8a8;border-radius:12px;padding:8px 16px;flex-shrink:0;cursor:pointer;">
        <div id="ddayBadge" style="font-size:22px;font-weight:800;color:#e06a00;line-height:1;">D-…</div>
        <div id="examLabel" style="font-size:11px;color:#94a3b8;margin-top:3px;">시험일 설정</div>
      </div>
    </div>
    <div style="height:14px;"></div>
    <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;">
      <div style="flex:1;min-width:280px;max-width:440px;">
        <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px;">
          <button type="button" onclick="calMove(-1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;padding:4px 8px;">◀</button>
          <div id="calTitle" style="font-size:17px;font-weight:700;color:#1e293b;min-width:64px;text-align:center;"></div>
          <button type="button" onclick="calMove(1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;padding:4px 8px;">▶</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;color:#94a3b8;margin-bottom:6px;">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;"></div>
      </div>
      <div style="flex:1;min-width:260px;">
        <div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:10px;">📈 월간 통계 <span style="font-size:11px;color:#94a3b8;font-weight:400;">월별 푼 문제 수</span></div>
        <div id="monthChart" style="display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:1px solid #eef2f9;"></div>
        <div style="margin-top:10px;font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span style="width:12px;height:12px;border-radius:3px;background:#ff8c1a;display:inline-block;"></span>GMP 2급 필기</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 신고 모달 -->
<div id="rptModal" class="rpt-overlay hidden" onclick="if(event.target===this)closeReport()">
  <div class="rpt-box">
    <h3><span style="color:var(--ng);">🚨</span> 문제 신고하기</h3>
    <div class="rpt-qtxt" id="rptQText"></div>
    <input type="hidden" id="rptQId">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">신고 내용 <span style="color:var(--ng);">*</span></label>
    <textarea id="rptContent" style="width:100%;min-height:100px;" placeholder="오류·오타·정답 이의·수정 제안 등"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
      <button class="btn ghost" onclick="closeReport()">취소</button>
      <button class="btn" style="background:#e4572e;" onclick="saveReport()">신고 접수</button>
    </div>
  </div>
</div>

<script>
/* ===== 저장소 키 ===== */
const K_Q='gmpq_questions_v2',K_WRONG='gmpq_wrong_v2',K_DAILY='gmpq_daily_v2',K_EXAM='gmpq_exam_v2',K_PROG='gmpq_prog_v2',K_REPORT='gmpq_reports_v2';

/* ===== 이론학습 박스 정의 ===== */
const STUDY=[

const DEFAULTS=[

/* ===== 상태 ===== */
let QS=[], curLevel='1', quiz=[], qi=0, answered={}, revealed={}, wrongMode=false, calRef=new Date();

function load(){try{QS=JSON.parse(localStorage.getItem(K_Q));}catch(e){QS=null;} if(!QS||!QS.length){QS=JSON.parse(JSON.stringify(DEFAULTS));persist();}}
function persist(){localStorage.setItem(K_Q,JSON.stringify(QS));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

/* ===== 탭 ===== */
function showTab(t){
  document.getElementById('front').classList.toggle('hidden',t!=='front');
  document.getElementById('back').classList.toggle('hidden',t!=='back');
  document.getElementById('tabBack').classList.toggle('active',t==='back');
  if(t==='back')renderList();
}
function setLevel(l){curLevel=l;
  document.querySelectorAll('#levelTabs button').forEach(b=>{const on=b.dataset.level===l;b.style.background=on?'var(--blue2)':'#fff';b.style.color=on?'#fff':'#475569';});
  refreshSetup();
}

/* ===== 설정/필터 ===== */
function sig(){return [curLevel,document.getElementById('fType').value,document.getElementById('fCat').value,document.getElementById('fOnlyMC').checked?'mc':'all',document.getElementById('fOrder').value].join('|');}
function filterPool(){
  const ty=document.getElementById('fType').value, ct=document.getElementById('fCat').value, only=document.getElementById('fOnlyMC').checked;
  return QS.filter(q=>String(q.level)===curLevel
    &&(ty==='all'||q.type===ty)
    &&(ct==='all'||q.cat===ct)
    &&(!only||q.type==='mc'||q.type==='scenario'));
}
function refreshSetup(){
  renderStudy();
  const pool=filterPool();
  const lvlTotal=QS.filter(q=>String(q.level)===curLevel).length;
  document.getElementById('fCount').textContent='선택된 문제: '+pool.length+'개 / LEVEL '+curLevel+' 전체 '+lvlTotal+'개';
  const w=getWrong();
  document.getElementById('wrongCount').textContent=w.length;
  document.getElementById('btnWrong').style.display=w.length?'':'none';
  const prog=getProg();
  const bStart=document.getElementById('btnStart'),bRe=document.getElementById('btnRestart'),info=document.getElementById('progressInfo');
  if(prog&&prog.sig===sig()&&prog.order&&prog.order.length){
    const done=Object.keys(prog.revealed||{}).length;
    bStart.textContent='▶ 이어서 풀기 ('+(prog.order.length-done)+'문 남음)';
    bRe.style.display='';info.textContent='이전 기록: '+done+' / '+prog.order.length+' 완료';
  }else{bStart.textContent='퀴즈 시작 ▶';bRe.style.display='none';info.textContent='';}
}
function renderStudy(){
  document.getElementById('studyBoxes').innerHTML=STUDY.map((s,i)=>`
   <a href="${encodeURI(s.href)}" style="flex:1 1 30%;min-width:150px;text-decoration:none;">
     <div class="study-box">
       <div class="study-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SVGS[i]}</svg></div>
       <div><div style="font-size:10px;color:var(--muted);margin-bottom:2px;">${s.n}</div>
       <div style="font-size:12px;font-weight:700;color:#1e293b;word-break:keep-all;">${esc(s.t)}</div></div>
     </div>
   </a>`).join('');
}

/* ===== 진행 저장 ===== */
function getProg(){try{return JSON.parse(localStorage.getItem(K_PROG));}catch(e){return null;}}
function saveProg(){if(wrongMode)return;localStorage.setItem(K_PROG,JSON.stringify({sig:sig(),order:quiz.map(q=>q.id),idx:qi,answered,revealed}));}

/* ===== 퀴즈 시작/이어서 ===== */
function startQuiz(){
  const prog=getProg();
  if(prog&&prog.sig===sig()&&prog.order&&prog.order.length){
    quiz=prog.order.map(id=>QS.find(q=>q.id===id)).filter(Boolean);
    answered=prog.answered||{};revealed=prog.revealed||{};qi=Math.min(prog.idx||0,quiz.length-1);wrongMode=false;
  }else{
    const pool=filterPool();
    if(!pool.length){alert('선택한 조건에 해당하는 문제가 없습니다.');return;}
    quiz=pool.slice();if(document.getElementById('fOrder').value==='rand')shuffle(quiz);
    qi=0;answered={};revealed={};wrongMode=false;saveProg();
  }
  enterQuiz();
}
function restartQuiz(){localStorage.removeItem(K_PROG);const pool=filterPool();if(!pool.length){alert('문제가 없습니다.');return;}quiz=pool.slice();if(document.getElementById('fOrder').value==='rand')shuffle(quiz);qi=0;answered={};revealed={};wrongMode=false;saveProg();enterQuiz();}
function startWrongNote(){const w=getWrong();quiz=w.map(id=>QS.find(q=>q.id===id)).filter(Boolean);if(!quiz.length){alert('오답 노트가 비어 있습니다.');return;}qi=0;answered={};revealed={};wrongMode=true;enterQuiz();}
function enterQuiz(){document.getElementById('setup').classList.add('hidden');document.getElementById('studyBoxes').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('wrongModeBadge').style.display=wrongMode?'':'none';renderQ();}

/* ===== 문항 표시 ===== */
function renderQ(){
  const q=quiz[qi];
  document.getElementById('qCat').textContent=q.cat||'';
  document.getElementById('qClause').textContent=q.clause||'';
  document.getElementById('qClause').style.display=q.clause?'':'none';
  document.getElementById('qPosTotal').textContent=(qi+1)+' / '+quiz.length;
  document.getElementById('qBar').style.width=((qi+1)/quiz.length*100)+'%';
  document.getElementById('qType').textContent={mc:'객관식',short:'단답형',essay:'서술·논술형',scenario:'시나리오'}[q.type]||'';
  document.getElementById('qScore').textContent='LEVEL '+q.level;
  document.getElementById('qText').textContent=q.q;
  const ow=document.getElementById('qOpts'), ta=document.getElementById('qTextAns');
  ow.innerHTML='';
  if(q.type==='mc'||q.type==='scenario'){
    ta.classList.add('hidden');
    (q.opts||[]).forEach((o,i)=>{const d=document.createElement('button');d.className='opt'+(answered[q.id]===i?' sel':'');d.innerHTML='<span class="mk">'+(i+1)+'</span>'+esc(o);d.onclick=()=>{if(revealed[q.id])return;answered[q.id]=i;saveProg();[...ow.children].forEach((c,j)=>c.classList.toggle('sel',j===i));};ow.appendChild(d);});
  }else{ta.classList.remove('hidden');ta.value=answered['t'+q.id]||'';ta.oninput=()=>{answered['t'+q.id]=ta.value;saveProg();};}
  document.getElementById('btnPrev').disabled=qi===0;
  document.getElementById('btnNext').textContent=qi===quiz.length-1?'결과 ▶':'다음 ▶';
  const ans=document.getElementById('qAns');
  if(revealed[q.id]){showAns(q);}else{ans.classList.add('hidden');}
}
function reveal(){const q=quiz[qi];revealed[q.id]=true;markDaily();saveProg();showAns(q);}
function showAns(q){
  const ans=document.getElementById('qAns');
  if(q.type==='mc'||q.type==='scenario'){
    [...document.getElementById('qOpts').children].forEach((c,i)=>{c.classList.remove('sel');if(i===q.ans)c.classList.add('correct');if(answered[q.id]===i&&i!==q.ans)c.classList.add('wrong');});
    const ok=answered[q.id]===q.ans;
    if(answered[q.id]!=null){if(ok)removeWrong(q.id);else addWrong(q.id);}
    ans.innerHTML='<span class="lbl">'+(answered[q.id]==null?'정답: '+(q.ans+1)+'번':(ok?'✅ 정답':'❌ 오답 · 정답 '+(q.ans+1)+'번'))+'</span>\n\n'+esc(q.explain||'');
  }else{
    ans.innerHTML='<span class="lbl">모범답안</span>\n'+esc(q.answerText||'')+(q.explain?'\n\n'+esc(q.explain):'');
  }
  ans.classList.remove('hidden');refreshWrongBtn();
}
function prevQ(){if(qi>0){qi--;saveProg();renderQ();}}
function nextQ(){if(qi<quiz.length-1){qi++;saveProg();renderQ();}else endQuizResult();}
function endQuiz(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('setup').classList.remove('hidden');document.getElementById('studyBoxes').classList.remove('hidden');refreshSetup();}
function endQuizResult(){
  let mc=0,ok=0;quiz.forEach(q=>{if((q.type==='mc'||q.type==='scenario')&&typeof q.ans==='number'){mc++;if(answered[q.id]===q.ans)ok++;}});
  document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
  document.getElementById('rScore').textContent=ok+' / '+mc;
  document.getElementById('rText').textContent=(mc?Math.round(ok/mc*100)+'점 · ':'')+'총 '+quiz.length+'문항 · 오답노트 '+getWrong().length+'문 저장됨';
}

/* ===== 오답노트 ===== */
function getWrong(){try{return JSON.parse(localStorage.getItem(K_WRONG))||[];}catch(e){return[];}}
function setWrong(a){localStorage.setItem(K_WRONG,JSON.stringify([...new Set(a)]));}
function addWrong(id){const w=getWrong();if(!w.includes(id)){w.push(id);setWrong(w);}}
function removeWrong(id){setWrong(getWrong().filter(x=>x!==id));}
function refreshWrongBtn(){const w=getWrong();document.getElementById('wrongCount').textContent=w.length;document.getElementById('btnWrong').style.display=w.length?'':'none';}

/* ===== 오늘의 학습 ===== */
function getDaily(){try{return JSON.parse(localStorage.getItem(K_DAILY))||{};}catch(e){return{};}}
function todayKey(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function markDaily(){const d=getDaily();d[todayKey()]=(d[todayKey()]||0)+1;localStorage.setItem(K_DAILY,JSON.stringify(d));renderDaily();}
function setExamDate(){const cur=localStorage.getItem(K_EXAM)||'';const v=prompt('시험일을 입력하세요 (YYYY-MM-DD)',cur);if(v===null)return;if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('형식: YYYY-MM-DD');return;}localStorage.setItem(K_EXAM,v);renderDaily();}
function renderDaily(){
  const d=getDaily();document.getElementById('dailyToday').textContent='오늘 푼 문제 '+(d[todayKey()]||0)+'개';
  const ex=localStorage.getItem(K_EXAM)||'';
  const badge=document.getElementById('ddayBadge'),lab=document.getElementById('examLabel');
  if(ex){const diff=Math.ceil((new Date(ex)-new Date(todayKey()))/86400000);badge.textContent=diff>0?'D-'+diff:(diff===0?'D-DAY':'D+'+(-diff));lab.textContent='시험일 '+ex;}
  else{badge.textContent='D-…';lab.textContent='시험일 설정 (클릭)';}
  const y=calRef.getFullYear(),m=calRef.getMonth();
  document.getElementById('calTitle').textContent=(m+1)+'월';
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let html='';for(let i=0;i<first;i++)html+='<div></div>';
  for(let dd=1;dd<=days;dd++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');const c=d[k]||0;const bg=c>=10?'#ff8c1a':c>=5?'#ffab52':c>=1?'#ffd8a8':'#f1f4f8';const col=c>=5?'#fff':'#64748b';const today=k===todayKey();html+='<div style="aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:'+bg+';color:'+col+';'+(today?'outline:2px solid var(--blue2);':'')+'">'+dd+(c?'<span style="font-size:9px;">'+c+'</span>':'')+'</div>';}
  document.getElementById('calGrid').innerHTML=html;
  const now=new Date();const arr=[];for(let i=6;i>=0;i--){const dt=new Date(now.getFullYear(),now.getMonth()-i,1);let sum=0;const pre=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');Object.keys(d).forEach(k=>{if(k.startsWith(pre))sum+=d[k];});arr.push({label:(dt.getMonth()+1)+'월',v:sum});}
  const max=Math.max(1,...arr.map(a=>a.v));
  document.getElementById('monthChart').innerHTML=arr.map(a=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;"><div style="font-size:11px;font-weight:700;color:#e06a00;margin-bottom:2px;">'+(a.v||'')+'</div><div style="width:60%;background:'+(a.v?'#ff8c1a':'#eef2f9')+';border-radius:4px 4px 0 0;height:'+(a.v/max*130)+'px;"></div><div style="font-size:10px;color:#94a3b8;margin-top:4px;">'+a.label+'</div></div>').join('');
}
function calMove(n){calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);renderDaily();}

/* ===== BackOffice ===== */
function toggleType(){const t=document.getElementById('eType').value,mc=(t==='mc'||t==='scenario');document.getElementById('mcFields').style.display=mc?'':'none';document.getElementById('txtFields').style.display=mc?'none':'';}
function saveQ(){
  const t=document.getElementById('eType').value;
  const q={id:document.getElementById('eId').value?+document.getElementById('eId').value:(Math.max(0,...QS.map(x=>x.id))+1),type:t,level:+document.getElementById('eLevel').value,cat:document.getElementById('eCat').value,clause:document.getElementById('eClause').value.trim(),q:document.getElementById('eQ').value.trim()};
  if(!q.q){alert('문제를 입력하세요.');return;}
  if(t==='mc'||t==='scenario'){q.opts=document.getElementById('eOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);if(q.opts.length<2){alert('보기 2개 이상');return;}q.ans=(+document.getElementById('eAnsIdx').value||1)-1;if(q.ans<0||q.ans>=q.opts.length){alert('정답 번호 확인');return;}q.explain=document.getElementById('eExpl').value.trim();}
  else{q.answerText=document.getElementById('eAns').value.trim();q.explain=document.getElementById('eExpl2').value.trim();}
  const idx=QS.findIndex(x=>x.id===q.id);if(idx>=0)QS[idx]=q;else QS.push(q);
  persist();resetForm();renderList();document.getElementById('saveMsg').textContent='저장됨';setTimeout(()=>document.getElementById('saveMsg').textContent='',1500);
}
function editQ(id){const q=QS.find(x=>x.id===id);if(!q)return;eId.value=q.id;eType.value=q.type;eLevel.value=q.level;eCat.value=q.cat;eClause.value=q.clause||'';eQ.value=q.q;eOpts.value=(q.opts||[]).join('\n');eAnsIdx.value=typeof q.ans==='number'?q.ans+1:'';eAns.value=q.answerText||'';eExpl.value=q.explain||'';eExpl2.value=q.explain||'';toggleType();window.scrollTo(0,0);}
function delQ(id){if(confirm('삭제할까요?')){QS=QS.filter(x=>x.id!==id);persist();renderList();}}
function resetForm(){['eId','eClause','eQ','eOpts','eAnsIdx','eExpl','eAns','eExpl2'].forEach(i=>document.getElementById(i).value='');eType.value='mc';eLevel.value='1';toggleType();}
function renderList(){
  const s=document.getElementById('bSearch').value.trim();
  const list=QS.filter(q=>!s||q.q.includes(s)||(q.cat||'').includes(s)||(q.clause||'').includes(s));
  document.getElementById('bCount').textContent=QS.length;
  document.getElementById('bList').innerHTML=list.map(q=>`<div class="qitem"><div class="body"><div class="qq">${esc(q.q.slice(0,90))}${q.q.length>90?'…':''}</div><div class="small">LV${q.level} · ${esc(q.cat)} · ${({mc:'객관식',short:'단답',essay:'서술',scenario:'시나리오'}[q.type])}${q.clause?' · '+esc(q.clause):''}</div></div><div class="acts"><button class="iconbtn" onclick="editQ(${q.id})">수정</button><button class="iconbtn del" onclick="delQ(${q.id})">삭제</button></div></div>`).join('')||'<p class="note">문제가 없습니다.</p>';
}
function exportJSON(){const b=new Blob([JSON.stringify(QS,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GMP2_quiz_questions.json';a.click();}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm('기존에 '+d.length+'개를 추가로 합칠까요? (취소=전체 교체)')){let mx=Math.max(0,...QS.map(x=>x.id));d.forEach(q=>{q.id=++mx;QS.push(q);});}else QS=d;persist();renderList();refreshSetup();alert('가져오기 완료: '+d.length+'문항');}catch(err){alert('JSON 형식 오류');}};r.readAsText(f);e.target.value='';}
function resetSeed(){if(confirm('기본 예시 문제로 초기화할까요?')){QS=JSON.parse(JSON.stringify(DEFAULTS));persist();localStorage.removeItem(K_PROG);renderList();refreshSetup();}}

/* ===== 신고 ===== */
function openReport(){document.getElementById('rptQText').textContent=quiz[qi].q.slice(0,60)+'…';document.getElementById('rptQId').value=quiz[qi].id;document.getElementById('rptModal').classList.remove('hidden');}
function closeReport(){document.getElementById('rptModal').classList.add('hidden');document.getElementById('rptContent').value='';}
function saveReport(){const txt=document.getElementById('rptContent').value.trim();if(!txt){alert('신고 내용을 입력하세요.');return;}const r=JSON.parse(localStorage.getItem(K_REPORT)||'[]');r.push({qid:+document.getElementById('rptQId').value,text:txt,at:new Date().toISOString()});localStorage.setItem(K_REPORT,JSON.stringify(r));closeReport();toast('신고가 접수되었습니다.');}

/* ===== init ===== */
load();setLevel('1');toggleType();renderDaily();
</script>
